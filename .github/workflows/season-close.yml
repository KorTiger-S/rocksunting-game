name: Season close

# 매일 00:10(한국 시간)에 시즌 마감일이 지났는지 확인한다.
# 지났으면: 랭킹 스냅샷 저장 → 모든 플레이어 기록 초기화 → 보고서를 reports 브랜치에 저장 + Issue로 알림
# (마감일 전에는 아무 것도 하지 않는다. 마감일은 Supabase SQL Editor에서 select public.rk_set_season_end('YYYY-MM-DD'); 로 바꾼다.)
on:
  schedule:
    - cron: '10 15 * * *'   # UTC 15:10 = KST 00:10
  workflow_dispatch:
    inputs:
      report_key:
        description: '이미 마감된 시즌의 보고서를 다시 만들 때만 시즌 키 입력 (예: 2026-09). 비우면 일반 마감 확인'
        required: false

permissions:
  contents: write
  issues: write

concurrency: season-close

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Close season and build report
        id: run
        env:
          SUPABASE_URL: https://arvoervppgbcihzguncs.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REPORT_KEY: ${{ github.event.inputs.report_key }}
        run: node scripts/close_season.js --out "$RUNNER_TEMP/report"

      - name: Save report to the reports branch
        if: steps.run.outputs.closed == 'true'
        env:
          NAME: ${{ steps.run.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin reports >/dev/null 2>&1; then
            git fetch origin reports
            git checkout -B reports origin/reports
          else
            git checkout --orphan reports
            git rm -rf . -q
          fi
          mkdir -p reports
          cp "$RUNNER_TEMP/report/$NAME.md" "$RUNNER_TEMP/report/$NAME.csv" reports/
          git add reports
          git commit -m "report: $NAME" || echo "변경 없음"
          git push origin reports

      - name: Notify with an issue
        if: steps.run.outputs.closed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.run.outputs.name }}
          TITLE: ${{ steps.run.outputs.title }}
        run: |
          {
            echo
            echo "---"
            echo "파일: [${NAME}.md](https://github.com/${{ github.repository }}/blob/reports/reports/${NAME}.md) · [${NAME}.csv](https://github.com/${{ github.repository }}/blob/reports/reports/${NAME}.csv) (\`reports\` 브랜치)"
          } >> "$RUNNER_TEMP/report/issue.md"
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/report/issue.md"
